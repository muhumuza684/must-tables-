name: Data Lake Tables CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-package:
    name: Test and package Power BI visual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full CI gate
        run: npm run ci

      - name: Verify PBIVIZ package exists
        shell: bash
        run: |
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.pbiviz' -print -quit)"

      - name: Upload PBIVIZ build
        uses: actions/upload-artifact@v4
        with:
          name: data-lake-tables-pbiviz
          path: dist/*.pbiviz
          if-no-files-found: error
          retention-days: 30

      - name: Upload build analyzer
        uses: actions/upload-artifact@v4
        with:
          name: data-lake-tables-build-report
          path: webpack.statistics.prod.html
          if-no-files-found: warn
          retention-days: 30