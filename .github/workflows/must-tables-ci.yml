name: MUST Tables CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    name: Test and package the Power BI visual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies (clean, from the lock file)
        run: npm ci

      - name: Full gate (type-check, tests, lint, package)
        run: npm run ci

      - name: Verify the .pbiviz exists
        shell: bash
        run: |
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.pbiviz' -print -quit)"
          {
            echo "### MUST Tables build"
            echo ""
            for f in dist/*.pbiviz; do echo "- \`$(basename "$f")\` - $(du -h "$f" | cut -f1)"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the clean build
        uses: actions/upload-artifact@v4
        with:
          name: must-tables-pbiviz
          path: dist/*.pbiviz
          if-no-files-found: error
          retention-days: 30

      - name: Upload build analyzer report
        uses: actions/upload-artifact@v4
        with:
          name: must-tables-build-report
          path: webpack.statistics.prod.html
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish a permanent GitHub Release
    needs: build-test-package
    runs-on: ubuntu-latest
    # Only a pushed version tag (for example v1.0.0.50) creates a release.
    # Ordinary commits still build and test above and keep the build for 30 days.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: must-tables-pbiviz
          path: dist

      - name: Verify the .pbiviz exists
        shell: bash
        run: |
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.pbiviz' -print -quit)"

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MUST Tables ${{ github.ref_name }}
          files: dist/*.pbiviz
          generate_release_notes: true
          fail_on_unmatched_files: true
